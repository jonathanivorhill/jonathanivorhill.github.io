<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slingstar</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: radial-gradient(circle at 50% 30%, #16204a 0%, #080c20 60%);
    color: #fff;
    font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    text-align: center;
  }
  h1 {
    margin: 0 0 .6rem;
    font-size: clamp(2rem, 9vw, 2.8rem);
    font-weight: 900;
    letter-spacing: .5rem;
    text-indent: .5rem;
  }
  p.tag { margin: 0 0 2.4rem; color: rgba(255,255,255,.45); letter-spacing: .08rem; }
  nav { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
  a {
    color: #fff;
    text-decoration: none;
    padding: .55rem 1.3rem;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .12rem;
  }
  a:hover, a:focus-visible { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.55); }
  a.play {
    display: inline-block;
    margin: 0 0 1rem;
    padding: 1rem 2.2rem;
    font-size: 1rem;
    letter-spacing: .14rem;
    background: #ffd75e;
    border-color: #ffd75e;
    color: #080c20;
    box-shadow: 0 0 32px rgba(255, 215, 94, .35);
  }
  a.play:hover, a.play:focus-visible { background: #ffe285; border-color: #ffe285; }
  p.soon { margin: 0 0 2.4rem; font-size: .75rem; color: rgba(255,255,255,.35); letter-spacing: .1rem; }
  footer { margin-top: 3rem; font-size: .75rem; color: rgba(255,255,255,.3); }
</style>
</head>
<body>
  <main>
    <h1>SLINGSTAR</h1>
    <p class="tag">sling between orbits — don't miss</p>
    <a class="play"
       href="https://play.google.com/store/apps/details?id=com.jonathanivorhill.slingstar">
      GET IT ON GOOGLE PLAY — FREE</a>
    <p class="soon">iPhone version coming soon</p>
    <nav>
      <a href="https://jonathanivorhill.github.io/slingstar-privacy/">PRIVACY POLICY</a>
      <a href="mailto:jonathanivorhill@gmail.com">CONTACT</a>
    </nav>
    <footer>An arcade game by Jonathan Hill.</footer>
  </main>
</body>
</html>
